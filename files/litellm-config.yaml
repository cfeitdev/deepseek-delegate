# LiteLLM gateway for the deepseek-delegate skill's agent. Only DeepSeek routes.
# Never point api_base straight at OpenCode: LiteLLM would send any Claude login token
# it receives there. 127.0.0.1:4011 is opencode-filter.py, which authenticates with
# OPENCODE_API_KEY itself.

model_list:
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: anthropic/deepseek-v4.1-flash
      api_base: http://127.0.0.1:4011
      api_key: os.environ/OPENCODE_API_KEY
      extra_headers:
        x-opencode-session: "litellm-gateway"

  # Same model under the "[1m]" name Claude Code sometimes sends.
  - model_name: "deepseek-v4.1-flash[1m]"
    litellm_params:
      model: anthropic/deepseek-v4.1-flash
      api_base: http://127.0.0.1:4011
      api_key: os.environ/OPENCODE_API_KEY
      extra_headers:
        x-opencode-session: "litellm-gateway"

  # Fallback model names Claude Code switches to when a request is flagged: also DeepSeek.
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/deepseek-v4.1-flash
      api_base: http://127.0.0.1:4011
      api_key: os.environ/OPENCODE_API_KEY
      extra_headers:
        x-opencode-session: "litellm-gateway"
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/deepseek-v4.1-flash
      api_base: http://127.0.0.1:4011
      api_key: os.environ/OPENCODE_API_KEY
      extra_headers:
        x-opencode-session: "litellm-gateway"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
